name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - feature/**

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: MortgageFlow_${{ github.run_id }}_CI!
        ports:
          - 14333:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'MortgageFlow_${{ github.run_id }}_CI!' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'MortgageFlow_${{ github.run_id }}_CI!' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 30s

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.301

      - name: Restore
        run: dotnet restore

      - name: Verify Domain stays framework independent
        run: |
          if grep -R "Microsoft.EntityFrameworkCore\|Microsoft.AspNetCore" src/MortgageFlow.Domain; then
            echo "Domain must not reference EF Core or ASP.NET Core."
            exit 1
          fi

      - name: Format check
        run: dotnet format --verify-no-changes

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage"
        env:
          MORTGAGEFLOW_SQL_PASSWORD: MortgageFlow_${{ github.run_id }}_CI!

      - name: Upload backend coverage
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: tests/**/TestResults/**/*.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.17.0
          cache: npm
          cache-dependency-path: src/mortgageflow-web/package-lock.json

      - name: Install
        working-directory: src/mortgageflow-web
        run: npm ci

      - name: Lint
        working-directory: src/mortgageflow-web
        run: npm run lint

      - name: Typecheck
        working-directory: src/mortgageflow-web
        run: npm run typecheck

      - name: Test
        working-directory: src/mortgageflow-web
        run: npm run test:run

      - name: Build
        working-directory: src/mortgageflow-web
        run: npm run build

      - name: Audit
        working-directory: src/mortgageflow-web
        run: npm audit --audit-level=moderate

      - name: Audit signatures
        working-directory: src/mortgageflow-web
        run: npm audit signatures

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build API image
        run: docker build --file src/MortgageFlow.Api/Dockerfile --tag mortgageflow-api:ci .

      - name: Build frontend image
        run: docker build --file src/mortgageflow-web/Dockerfile --tag mortgageflow-web:ci .
