services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: mortgageflow-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MORTGAGEFLOW_SQL_PASSWORD:?Set MORTGAGEFLOW_SQL_PASSWORD in your shell or .env file}
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - mortgageflow-sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\""
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: src/MortgageFlow.Api/Dockerfile
    container_name: mortgageflow-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Demo
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=MortgageFlow;User Id=sa;Password=${MORTGAGEFLOW_SQL_PASSWORD:?Set MORTGAGEFLOW_SQL_PASSWORD in your shell or .env file};TrustServerCertificate=True;Encrypt=True
      Jwt__Issuer: ${Jwt__Issuer:-MortgageFlow}
      Jwt__Audience: ${Jwt__Audience:-MortgageFlow.Api}
      Jwt__SigningKey: ${Jwt__SigningKey:?Set Jwt__SigningKey in your shell or .env file}
      Jwt__ExpiryMinutes: ${Jwt__ExpiryMinutes:-60}
      Seed__DemoPassword: ${Seed__DemoPassword:?Set Seed__DemoPassword in your shell or .env file}
      Database__ApplyMigrationsOnStartup: "true"
    ports:
      - "127.0.0.1:5123:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: src/mortgageflow-web/Dockerfile
    container_name: mortgageflow-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  mortgageflow-sqlserver-data:
